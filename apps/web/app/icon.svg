<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <!--
    Browser-tab version of the Vyapaar mark: a rupee held between two bounds.

    Carries its own dark ground because a tab strip may be any colour and the
    amber gradient vanishes against light chrome. Strokes are a touch heavier
    than the in-page mark, since this one is only ever seen small.
  -->
  <defs>
    <linearGradient id="m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd0a8"/>
      <stop offset="50%" stop-color="#ffb77b"/>
      <stop offset="100%" stop-color="#b16d2e"/>
    </linearGradient>
  </defs>

  <rect width="36" height="36" rx="8" fill="#141416"/>

  <!-- the two bounds: buyer's mandate, merchant's margin floor -->
  <path d="M12.5 8 H8.5 V28 H12.5" fill="none" stroke="url(#m)" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M23.5 8 H27.5 V28 H23.5" fill="none" stroke="url(#m)" stroke-width="2.3"
        stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/>

  <!-- the money, inside them -->
  <text x="18" y="25.2" text-anchor="middle" font-weight="700" font-size="19"
        font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif"
        fill="url(#m)">&#8377;</text>
</svg>
